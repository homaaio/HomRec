name: Secret scanning

# Scans every push and pull request for things that look like committed
# secrets (API keys, tokens, private keys, connection strings...) using
# gitleaks (https://github.com/gitleaks/gitleaks). Also runs on a weekly
# schedule so a secret that slipped in via a merge/rebase edge case still
# gets caught, and can be triggered by hand from the Actions tab.
#
# If it ever finds a real secret: rotate/revoke that credential first
# (assume it's compromised - it was public the moment it was pushed),
# THEN clean the git history (e.g. with `git filter-repo` or the
# BFG Repo-Cleaner) - removing the file in a new commit alone is not
# enough, it's still readable in the old commit.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history - gitleaks scans commit-by-commit, not just the working tree

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set a GITLEAKS_LICENSE repo secret if you use gitleaks
          # Pro/Enterprise features. The open-source scan above works fine
          # without it.
